sonar.projectKey=mayflower_UI-Testing-Tool_3e72663b-760e-423c-ad27-1ec99911135b
sonar.projectName=UI-Testing-Tool

sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,docs/**,screenshots/**,reports/**,release_notes/**,mayflowerDeploy/**,static/**,**/__pycache__/**,.venv/**

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

