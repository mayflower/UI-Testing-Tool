# nicht durch Unit-Tests. Aus dem Coverage-Schnitt ausschliessen.
sonar.coverage.exclusions=utils/chat_helpers.py,utils/login_helper.py,utils/website_scanner.py,utils/discovery.py,run.py,conftest.py

sonar.sourceEncoding=UTF-8
